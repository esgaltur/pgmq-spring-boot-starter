name: Publish to GitHub Packages

# Runs when a version tag such as v0.1.0 is pushed: tests the release and publishes it.
# Free for this public repository; the workflow's own token publishes, no personal token needed.
on:
  push:
    tags: [ "v*" ]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        # Writes a settings.xml server "github" that authenticates with GITHUB_TOKEN.
        server-id: github

    - name: The pom version matches the tag
      run: |
        version=$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout)
        if [ "v$version" != "$GITHUB_REF_NAME" ]; then
          echo "::error::pom.xml version $version does not match tag $GITHUB_REF_NAME"
          exit 1
        fi

    - name: Test and publish
      # Testcontainers uses the Docker daemon of the ubuntu-latest runner.
      run: mvn -B deploy
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
